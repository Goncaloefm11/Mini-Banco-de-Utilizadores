<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Utilizadores</title>
    <style>
    form label {
        font-size: 22px;
        margin-right: 5px;
    }

    table {
        border-collapse: collapse;
        margin: 30px auto;
        background-color: #ffffff;
        color: #222;
        border-radius: 8px;
        overflow: hidden;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 12px 18px;
        font-size: 20px;
    }

    th {
        background-color: #333338;
        color: white;
    }

    tr:hover {
        background-color: #f2f2f2;
    }

    form {
        text-align: center;
        background-color: #ffffff;
        color: #222;
        width: 600px;
        margin: 30px auto;
        padding: 25px;
        border-radius: 10px;
    }

    input {
        padding: 8px;
        font-size: 18px;
        border: 1px solid #aaa;
        border-radius: 5px;
    }

    button {
        font-size: 18px;
        padding: 10px 18px;
        margin: 4px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background-color: #333338;
        color: white;
    }

    button:hover {
        background-color: #55555b;
    }

    h1, h2 {
        text-align: center;
    }

    h1 {
        margin-top: 30px;
    }

    h2 {
        font-size: 32px;
        margin-top: 40px;
    }

    body {
        background-color: #515154;
        color: #fff;
        font-size: 16px;
        font-family: Arial, sans-serif;
    }

    #mensagem {
        text-align: center;
        font-size: 20px;
        margin-top: 20px;
    }
    </style>
</head>

<body>

    <h1>Adicionar Utilizador</h1>

    <form id="userForm">

        <label>Nome:</label>
        <input type="text" id="nome">

        <br><br>

        <label>Idade:</label>
        <input type="number" id="idade">

        <br><br>

        <label>Email:</label>
        <input type="email" id="email">

        <br><br>

        <button type="submit">Adicionar Utilizador</button>

    </form>

    <h2>Utilizadores</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="listaUtilizadores"></tbody>
    </table>
    

    <p id="mensagem"></p>

    <script>
        async function carregarUtilizadores() {
            const resposta = await fetch("https://mini-banco-de-utilizadores.onrender.com/users");
            const utilizadores = await resposta.json();
            const lista = document.getElementById("listaUtilizadores");

            lista.innerHTML = ""

            utilizadores.forEach(function(user) {

                const item = document.createElement("tr");
                //cria uma linha
                const id = document.createElement("td");
                id.textContent = user.id;
                //cria as celulas da linha
                const nome = document.createElement("td");
                nome.textContent = user.nome;

                const idade = document.createElement("td");
                idade.textContent = user.idade;

                const email = document.createElement("td");
                email.textContent = user.email;

                const acoes = document.createElement("td");
                
                item.appendChild(id);
                item.appendChild(nome);
                item.appendChild(idade);
                item.appendChild(email);
                item.appendChild(acoes);

                const botaoEditar = document.createElement("button");

                botaoEditar.textContent = "Editar";

                botaoEditar.addEventListener("click", function() {

                    acoes.innerHTML = "";
                    nome.innerHTML = "";
                    idade.innerHTML = "";
                    email.innerHTML = "";

                    const inputNome = document.createElement("input");
                    inputNome.value = user.nome; //por omissao mete o que ja estava

                    const inputIdade = document.createElement("input");
                    inputIdade.type = "number";
                    inputIdade.value = user.idade;

                    const inputEmail = document.createElement("input");
                    inputEmail.type = "email";
                    inputEmail.value = user.email;


                    nome.appendChild(inputNome);
                    idade.appendChild(inputIdade);
                    email.appendChild(inputEmail);


                    const botaoGuardar = document.createElement("button");
                    botaoGuardar.textContent = "Guardar";
                    botaoGuardar.addEventListener("click", async function() {

                        if (inputIdade.value < 18) {
                            alert("A idade tem de ser igual ou superior a 18 anos.");
                            return;
                        }

                        const resposta = await fetch(`https://mini-banco-de-utilizadores.onrender.com/users/${user.id}`, {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                nome: inputNome.value, //poe o que o utilizador escolher
                                idade: inputIdade.value,
                                email: inputEmail.value
                            })
                        });
                            
                            

                        const resultado = await resposta.json();

                        document.getElementById("mensagem").textContent = resultado.mensagem;

                        await carregarUtilizadores();
                    });

                    const botaoCancelar = document.createElement("button");
                    botaoCancelar.textContent = "Cancelar";
                    botaoCancelar.addEventListener("click", function() {

                        nome.innerHTML = "";
                        idade.innerHTML = "";
                        email.innerHTML = "";
                        acoes.innerHTML = "";

                        nome.textContent = user.nome;
                        idade.textContent = user.idade;
                        email.textContent = user.email;

                        acoes.appendChild(botaoEditar);
                        acoes.appendChild(botaoApagar);
                    });

                    acoes.appendChild(botaoGuardar);
                    acoes.appendChild(botaoCancelar);

                });
                acoes.appendChild(botaoEditar);

                const botaoApagar = document.createElement("button");
                botaoApagar.textContent = "Apagar";
                botaoApagar.addEventListener("click", async function() {

                    const resposta = await fetch(`https://mini-banco-de-utilizadores.onrender.com/users/${user.id}`, {
                        method: "DELETE"
                    });

                    const resultado = await resposta.json();
                    document.getElementById("mensagem").textContent = resultado.mensagem;
                    await carregarUtilizadores();
                });

                acoes.appendChild(botaoApagar);

                lista.appendChild(item);
            });
        }




        const formulario = document.getElementById("userForm")
        formulario.addEventListener("submit", async function (event) {
            //quando carregar em adicionar utlizador é acionada esta funcao
            event.preventDefault(); //nao recarregues a pagina ao enviar os dados
            
            const nome = document.getElementById("nome").value;
            const idade = document.getElementById("idade").value;
            const email = document.getElementById("email").value;

            const resposta = await fetch("https://mini-banco-de-utilizadores.onrender.com/users", {
                //flask quero falar contigo atraves do /users
                method: "POST", //quero criar alguma coisa
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: nome,
                    idade: idade,
                    email: email
                })
            });
            const resultado = await resposta.json();

            document.getElementById("mensagem").textContent = resultado.mensagem;
            await carregarUtilizadores();
        })

        carregarUtilizadores();

    </script>


</body>
</html>
